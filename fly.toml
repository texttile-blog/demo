# ============================================================
#  ONE MACHINE. NEVER TWO.
# ============================================================
#
#  The whole installation is one SQLite file on one volume. SQLite
#  takes one writer, and a Fly volume mounts on one machine. A second
#  machine gets a volume of its own, so it would answer readers out of
#  a second, older database and write entries, comments and uploads
#  that the first machine never sees. Nothing warns you: both sites
#  work, and each one is missing half the blog.
#
#  So never run any of these:
#
#      fly scale count 2
#      fly machine clone
#      fly deploy --ha    (or a deploy that creates a standby)
#
#  Check before and after every deploy:
#
#      fly status -a texttile-demo        # exactly one machine
#
#  A deploy replaces the one machine in place, which means a few
#  seconds without the site. That is the price of one database, and it
#  is the right price for a blog.
#
# ============================================================
#
# Deploys the published texttile image to Fly.io.
# The app itself lives at github.com/texttile-blog/texttile, and that
# repository deploys its own source to a different app, texttile-staging
# on staging.texttile.blog. This file runs the demo.
#
# One-time setup for a new instance:
#   fly apps create <name> --org <org>
#   fly volumes create data --size 3 --region <region> -a <name>
#   fly secrets set SECRET_KEY_BASE=<value> -a <name>
#   fly secrets set ADMIN_USERS="<name1>,<name2>" -a <name>
#   fly certs add <domain> -a <name>
# Then change `app` and PHX_HOST below and run: fly deploy

app = "texttile-demo"
primary_region = "fra"

# The major tag, not latest. Every build of texttile carries its version
# from mix.exs: the exact number and the commit stand still, while 2, 2.0
# and latest follow the newest build that fits them. The demo takes every
# 2.x build on its next deploy, and a breaking major stops it here until
# somebody raises this line on purpose.
[build]
  image = "ghcr.io/texttile-blog/texttile:2"

[env]
  PHX_HOST = "demo.texttile.blog"
  # One volume holds both; the paths are free on other hosts.
  DATABASE_PATH = "/data/db/texttile.db"
  UPLOADS_PATH = "/data/uploads"
  # The Fly proxy writes this header itself, so the comment rate limit
  # can count by the reader instead of by the proxy.
  CLIENT_IP_HEADER = "fly-client-ip"
  # Mail: this app carries MAIL_ADAPTER, MAIL_FROM and RESEND_API_KEY as
  # secrets, so the sender address stays out of the file:
  #   fly secrets set MAIL_ADAPTER=resend MAIL_FROM=blog@demo.texttile.blog \
  #     RESEND_API_KEY=... -a texttile-demo
  # Valid adapters: resend, postmark, brevo, smtp, ses. Unset = no mail.

# The one volume, on the one machine. See the head of this file.
[mounts]
  source = "data"
  destination = "/data"
  initial_size = "3GB"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  # Keep the only configured machine running. The single mounted volume
  # constrains the maximum machine count to one.
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

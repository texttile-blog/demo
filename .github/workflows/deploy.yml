name: Deploy

on:
  workflow_dispatch:
  schedule:
    # Daily at 03:17 Berlin time: avoid peak load at the top of the hour.
    - cron: "17 3 * * *"
      timezone: "Europe/Berlin"
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify the single machine
        run: test "$(flyctl machine list --json | jq length)" -eq 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify the blog
        run: >-
          curl --fail --location --silent --show-error
          --retry 10 --retry-all-errors --retry-delay 3
          --connect-timeout 5 --max-time 15
          https://demo.texttile.blog/blog > /dev/null
